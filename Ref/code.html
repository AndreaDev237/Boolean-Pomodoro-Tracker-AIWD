<!DOCTYPE html>

<html lang="en"><head><meta charset="utf-8"/><meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport"/><meta content="mobile_blank" name="shell-type"/><link href="https://fonts.googleapis.com" rel="preconnect"/><link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/><link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet"/><link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/><style>@layer base{html,body{width:100vw;min-height:100vh;margin:0;padding:0;}body{overscroll-behavior:none;}.pb-safe{padding-bottom:env(safe-area-inset-bottom,0px);}.pt-safe{padding-top:env(safe-area-inset-top,0px);}main>:first-child{margin-top:0!important;}main>:last-child{margin-bottom:0!important;}}::-webkit-scrollbar{display:none;}</style><script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script><script id="tailwind-config">
tailwind.config = {
  darkMode: "class",
  theme: {
    extend: {
      colors: {
        background: "#FFF8F3",
        primary: "#E5484D",
        "primary-hover": "#D93D42",
        secondary: "#2F9E6E",
        "on-surface": "#1F1F1F",
        "text-muted": "#8A8A8A",
        border: "#F5ECE6"
      },
      fontFamily: {
        sans: ['"Plus Jakarta Sans"', 'sans-serif'],
      },
      boxShadow: {
        soft: '0 4px 20px rgba(0, 0, 0, 0.04)',
        glow: '0 8px 24px rgba(229, 72, 77, 0.30)',
        button: '0 2px 10px rgba(0, 0, 0, 0.03)'
      }
    }
  }
};
</script><style>
    body {
      min-height: max(884px, 100dvh);
      font-family: 'Plus Jakarta Sans', sans-serif;
    }
    .tnum {
      font-variant-numeric: tabular-nums;
    }
  </style>
</head><body class="bg-background text-on-surface antialiased"><main class="min-h-screen w-full bg-background pt-safe pb-safe flex flex-col justify-between"><div class="flex flex-col w-full px-6 py-4 space-y-6 flex-1 justify-between">
<!-- 1. Header -->
<header class="flex items-center justify-between pt-1">
<div class="flex items-center gap-2.5">
<span class="w-3 h-3 bg-primary rounded-full shadow-sm"></span>
<h1 class="text-xl font-bold text-on-surface tracking-tight">Pomodoro Focus</h1>
</div>
<button aria-label="Impostazioni" class="w-11 h-11 flex items-center justify-center bg-white border border-border rounded-2xl shadow-soft text-on-surface active:scale-95 transition-all" type="button">
<span class="material-symbols-outlined text-[22px] text-on-surface">settings</span>
</button>
</header>
<!-- 2. Mode Selector / Segmented Control -->
<nav aria-label="Modalità" class="grid grid-cols-3 p-1.5 bg-white border border-border rounded-2xl shadow-soft gap-1">
<button class="h-10 flex items-center justify-center text-sm font-semibold bg-primary text-white rounded-xl shadow-sm transition-all" type="button">
      Focus
    </button>
<button class="h-10 flex items-center justify-center text-sm font-medium text-text-muted hover:text-on-surface rounded-xl transition-all" type="button">
      Pausa breve
    </button>
<button class="h-10 flex items-center justify-center text-sm font-medium text-text-muted hover:text-on-surface rounded-xl transition-all" type="button">
      Pausa lunga
    </button>
</nav>
<!-- 3. Central Main Timer (Circular Progress Ring) -->
<section aria-label="Timer principale" class="flex flex-col items-center justify-center py-2">
<div class="relative w-[240px] h-[240px] flex items-center justify-center">
<svg class="w-full h-full -rotate-90 transform" viewbox="0 0 240 240">
<!-- Background Track -->
<circle cx="120" cy="120" fill="none" r="98" stroke="#F3ECE7" stroke-width="14"></circle>
<!-- Progress Arc (~75%) -->
<circle cx="120" cy="120" fill="none" r="98" stroke="#E5484D" stroke-dasharray="615.75" stroke-dashoffset="153.94" stroke-linecap="round" stroke-width="14"></circle>
</svg>
<!-- Center Data -->
<div class="absolute inset-0 flex flex-col items-center justify-center select-none">
<span class="text-[58px] leading-none font-bold text-on-surface tracking-tight tnum">
          18:42
        </span>
<span class="mt-2 text-xs font-semibold text-text-muted tracking-[0.2em] uppercase">
          Concentrati
        </span>
</div>
</div>
</section>
<!-- 4. Task Input Field -->
<div class="flex flex-col space-y-2">
<label class="text-sm font-medium text-on-surface" for="task-input">
      Su cosa stai lavorando?
    </label>
<div class="relative flex items-center">
<input class="w-full h-12 px-4 bg-white border border-border rounded-2xl text-sm text-on-surface placeholder:text-text-muted shadow-soft focus:outline-none focus:ring-2 focus:ring-primary/20 focus:border-primary transition-all" id="task-input" placeholder="Es. ripassare il CSS" type="text"/>
</div>
</div>
<!-- 5. Action Controls -->
<div class="flex items-center justify-center gap-5 pt-1">
<!-- Reset Button -->
<button aria-label="Ripristina sessione" class="w-13 h-13 w-[52px] h-[52px] flex items-center justify-center rounded-full border border-border bg-white text-on-surface shadow-soft active:scale-95 transition-all" type="button">
<span class="material-symbols-outlined text-[22px] text-on-surface">refresh</span>
</button>
<!-- Primary CTA: Avvia -->
<button class="h-14 px-8 flex items-center justify-center gap-2.5 bg-primary text-white rounded-full font-bold text-base shadow-glow hover:bg-primary-hover active:scale-95 transition-all min-w-[150px]" type="button">
<span class="material-symbols-outlined text-[22px] text-white" style="font-variation-settings: 'FILL' 1;">play_arrow</span>
<span>Avvia</span>
</button>
<!-- Skip Button -->
<button aria-label="Salta sessione" class="w-[52px] h-[52px] flex items-center justify-center rounded-full border border-border bg-white text-on-surface shadow-soft active:scale-95 transition-all" type="button">
<span class="material-symbols-outlined text-[22px] text-on-surface">skip_next</span>
</button>
</div>
<!-- 6. Session Indicator -->
<div class="flex flex-col items-center space-y-2.5 pt-1">
<span class="text-xs font-medium text-text-muted">Sessione 2 di 4</span>
<div aria-label="Stato sessione: 2 di 4 completate" class="flex items-center gap-2.5" role="status">
<span class="w-2.5 h-2.5 bg-secondary rounded-full shadow-sm"></span>
<span class="w-2.5 h-2.5 bg-secondary rounded-full shadow-sm"></span>
<span class="w-2.5 h-2.5 border-2 border-[#E0D6D0] rounded-full bg-white"></span>
<span class="w-2.5 h-2.5 border-2 border-[#E0D6D0] rounded-full bg-white"></span>
</div>
</div>
<!-- 7. Summary Card (Bottom) -->
<section aria-label="Riepilogo giornaliero" class="mt-auto bg-white border border-border rounded-2xl p-4 shadow-soft">
<div class="flex items-center gap-3">
<div class="w-9 h-9 rounded-xl bg-background border border-border flex items-center justify-center shrink-0">
<span class="material-symbols-outlined text-[20px] text-on-surface">schedule</span>
</div>
<div class="flex flex-col min-w-0">
<span class="text-sm font-medium text-on-surface truncate">
          Oggi: 3 pomodori · 75 min di concentrazione
        </span>
</div>
</div>
</section>
</div></main></body></html>
